<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keasser Gonzales | System & Web Developer</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:#020617;color:#fff;}

.container{max-width:1100px;margin:auto;padding:20px;}

.project-preview,.shot{
  cursor:pointer;
  position:relative;
  overflow:hidden;
  border-radius:16px;
}

.project-preview img,.shot img{
  width:100%;
  display:block;
  transition:0.4s;
}

/* DESKTOP HOVER */
.project-preview:hover img,
.shot:hover img{
  transform:scale(1.1);
}

/* MOBILE TAP FEEL */
.project-preview:active img,
.shot:active img{
  transform:scale(1.05);
}

/* MODAL */
.image-modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.image-modal.active{display:flex;}

.modal-content{
  width:95%;
  max-width:900px;
}

.modal-content img{
  width:100%;
  border-radius:12px;
}

.modal-close{
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>Featured Project</h2>

<div class="project-preview image-click">
  <img src="admin-files.png">
</div>

<br>

<div class="shot image-click"><img src="admin-files.png"></div>
<div class="shot image-click"><img src="admin-users.png"></div>
<div class="shot image-click"><img src="drive-panel.png"></div>
<div class="shot image-click"><img src="login.png"></div>

</div>

<!-- MODAL -->
<div class="image-modal" id="modal">
  <div class="modal-close" id="close">&times;</div>
  <div class="modal-content">
    <img id="modalImg">
  </div>
</div>

<script>
const items = document.querySelectorAll(".image-click");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const close = document.getElementById("close");

items.forEach(item=>{
  item.addEventListener("click",()=>{
    const img = item.querySelector("img");
    modalImg.src = img.src;
    modal.classList.add("active");
    document.body.style.overflow="hidden";
  });
});

close.onclick = ()=>{
  modal.classList.remove("active");
  document.body.style.overflow="";
};

modal.onclick = (e)=>{
  if(e.target === modal){
    modal.classList.remove("active");
    document.body.style.overflow="";
  }
};
</script>

</body>
</html>
